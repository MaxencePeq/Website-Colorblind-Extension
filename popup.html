<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Website for colorblind</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="p-3 bg-light">
<h1 class="h6 text-danger">/!\ Certain site peuvent ne pas fonctionner avec l'extension /!\</h1>
<p class="small text-secondary">Sélectionnez le profil adapté à votre vision :</p>

<div class="list-group shadow-sm">
    <label class="list-group-item d-flex gap-3 align-items-center">
        <input class="form-check-input flex-shrink-0 m-0" type="radio" name="daltonisme" value="aucun">
        <span><strong>Aucune correction</strong><small class="d-block text-secondary">Couleurs d'origine</small></span>
    </label>
    <label class="list-group-item d-flex gap-3 align-items-center">
        <input class="form-check-input flex-shrink-0 m-0" type="radio" name="daltonisme" value="protanopie">
        <span><strong>Protanopie</strong><small class="d-block text-secondary">Difficulté avec le Rouge</small></span>
    </label>
    <label class="list-group-item d-flex gap-3 align-items-center">
        <input class="form-check-input flex-shrink-0 m-0" type="radio" name="daltonisme" value="deuteranopie">
        <span><strong>Deutéranopie</strong><small class="d-block text-secondary">Difficulté avec le Vert</small></span>
    </label>
    <label class="list-group-item d-flex gap-3 align-items-center">
        <input class="form-check-input flex-shrink-0 m-0" type="radio" name="daltonisme" value="tritanopie">
        <span><strong>Tritanopie</strong><small class="d-block text-secondary">Difficulté avec le Bleu</small></span>
    </label>
</div>

<script src="popup.js"></script>
</body>
</html>
