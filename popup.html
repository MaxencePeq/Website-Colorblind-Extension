<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Website for colorblind</title>
    <link href="style/popup-style.css" rel="stylesheet" />
</head>
<body>
<h1>/!\ Certain site peuvent ne pas fonctionner avec l'extension /!\</h1>
<h4>Sélectionnez le profil adapté à votre vision :</h4>

<div class="options-container">
    <label class="radio-option">
        <input type="radio" name="daltonisme" value="aucun">
        <span class="label-title">Aucune correction</span>
        <span class="label-desc">Couleurs d'origine</span>
    </label>
    <label class="radio-option">
        <input type="radio" name="daltonisme" value="protanopie">
        <span class="label-title">Protanopie</span>
        <span class="label-desc">Difficulté avec le Rouge</span>
    </label>
    <label class="radio-option">
        <input type="radio" name="daltonisme" value="deuteranopie">
        <span class="label-title">Deutéranopie</span>
        <span class="label-desc">Difficulté avec le Vert</span>
    </label>
    <label class="radio-option">
        <input type="radio" name="daltonisme" value="tritanopie">
        <span class="label-title">Tritanopie</span>
        <span class="label-desc">Difficulté avec le Bleu</span>
    </label>
</div>

<script src="popup.js"></script>
</body>
</html>
